name: tasks_app
description: "Tasks App with Admin and Member roles (local + Firebase)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # 🧩 UI & utilities
  cupertino_icons: ^1.0.8
  intl: ^0.18.1

  # 🔥 Firebase packages (latest compatible versions)
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.0

  # 📁 File picker for attachments
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
